name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build:client

  vitest-unit-tests:
    name: Vitest Unit & Edge Case Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run Vitest Suite
        run: npm run test

  docker-build-verify:
    name: Build & Verify Production Container (<65MB)
    runs-on: ubuntu-latest
    needs: vitest-unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: splendor-app:test
      - name: Verify Image Size (< 100MB)
        run: |
          IMAGE_SIZE_BYTES=$(docker image inspect splendor-app:test --format='{{.Size}}')
          IMAGE_SIZE_MB=$(echo "scale=2; $IMAGE_SIZE_BYTES / 1024 / 1024" | bc)
          echo "Docker Image Size: ${IMAGE_SIZE_MB} MB"
          if [ $(echo "$IMAGE_SIZE_MB > 100" | bc) -eq 1 ]; then
            echo "ERROR: Image size ${IMAGE_SIZE_MB}MB exceeds 100MB threshold!"
            exit 1
          fi
          echo "SUCCESS: Docker image size is under 100MB!"
